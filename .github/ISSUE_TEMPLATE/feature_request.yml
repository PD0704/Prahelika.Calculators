name: Feature request
description: Suggest a new calculator or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: Who would use it, and for what?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: An example input and the answer you would expect.