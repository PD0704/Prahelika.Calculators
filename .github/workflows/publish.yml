name: Publish

# Runs when a tag starting with "v" is pushed, for example v0.3.1-alpha.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub release
  id-token: write   # lets GitHub prove to nuget.org who is publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Prahelika.Calculators

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # v0.3.1-alpha becomes 0.3.1-alpha
      - name: Get the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Prahelika.Calculators.Core/Prahelika.Calculators.Core.csproj --configuration Release --no-build -p:Version=$VERSION --output ./artifacts

      # Exchanges GitHub's proof for a short-lived NuGet key. Keep it right before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # If you created the release on the GitHub website, attach the package to it.
      # If you only pushed a tag, create the release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi